const c=document.getElementById("c"),ctx=c.getContext("2d"); let timer;
img.onload=()=>{c.width=img.naturalWidth;c.height=img.naturalHeight;start()};

function start(){
 clearInterval(timer); ctx.clearRect(0,0,c.width,c.height);
 const off=document.createElement("canvas"),o=off.getContext("2d");
 off.width=c.width;off.height=c.height;o.drawImage(img,0,0);
 const d=o.getImageData(0,0,c.width,c.height).data;
 let points=[];
 // Sample the original image and draw colored pixels progressively.
 for(let y=0;y<c.height;y+=3) for(let x=0;x<c.width;x+=3){
   const i=(y*c.width+x)*4;
   if(d[i+3]>20) points.push([x,y,d[i],d[i+1],d[i+2]]);
 }
 points.sort(()=>Math.random()-.5);
 let n=0,batch=Math.max(150,Math.floor(points.length/180));
 timer=setInterval(()=>{
   for(let k=0;k<batch && n<points.length;k++,n++){
     const [x,y,r,g,b]=points[n];
     ctx.fillStyle=`rgb(${r},${g},${b})`;
     ctx.fillRect(x,y,3,3);
   }
   if(n>=points.length) clearInterval(timer);
 },20);
}
</script>
